<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>JobTrack AI</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    width: 280px;
    padding: 16px;
    margin: 0;
  }
  h3 { margin: 0 0 4px; font-size: 15px; }
  p.ayuda { margin: 0 0 12px; font-size: 12px; color: #777; line-height: 1.4; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  input {
    width: 100%; box-sizing: border-box; padding: 7px 8px; margin-bottom: 10px;
    border: 1px solid #ccc; border-radius: 5px; font-size: 13px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .secundario {
    margin-top: 8px;
    display: block;
    text-align: center;
    background: none;
    border: 1px solid #d0d0d5;
    color: #1a1a1a;
    text-decoration: none;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .enlace {
    background: none; border: none; color: #2563eb; text-decoration: underline;
    cursor: pointer; font-size: 12px; padding: 0; width: auto; display: block; margin-top: 10px;
  }
  #estado {
    margin-top: 12px;
    font-size: 13px;
    color: #444;
    min-height: 16px;
    line-height: 1.4;
  }
  #estado.error { color: #dc2626; }
  #estado.ok { color: #166534; }
  #sesionInfo { font-size: 12px; color: #666; margin-bottom: 10px; word-break: break-all; }
  section[hidden] { display: none; }
</style>
</head>
<body>
  <h3>JobTrack AI</h3>

  <!-- Step 1, first run only: which backend this install talks to.
       Every account shares the same backend deployment, so this is
       configured once and not asked again, unlike login. -->
  <section id="seccionBackend">
    <p class="ayuda">Primero, la dirección del backend de JobTrack AI (la que te haya pasado quien lo desplegó).</p>
    <label for="campoBackend">URL del backend</label>
    <input id="campoBackend" placeholder="https://tu-backend.onrender.com" />
    <button id="btnGuardarBackend">Guardar</button>
  </section>

  <!-- Paso 2: iniciar sesión con tu cuenta (email+password) en ese backend. -->
  <section id="seccionLogin" hidden>
    <p class="ayuda">Inicia sesión con tu cuenta de JobTrack AI.</p>
    <label for="campoEmail">Email</label>
    <input id="campoEmail" type="email" autocomplete="email" />
    <label for="campoPassword">Contraseña</label>
    <input id="campoPassword" type="password" autocomplete="current-password" />
    <button id="btnLogin">Entrar</button>
    <button type="button" class="enlace" id="btnCambiarBackendDesdeLogin">Cambiar de backend</button>
  </section>

  <!-- Paso 3: ya logueado — lo de siempre. -->
  <section id="seccionPrincipal" hidden>
    <div id="sesionInfo"></div>
    <button id="enviar">Enviar esta oferta al Radar</button>
    <a class="secundario" id="enlacePanel" href="#" target="_blank">Abrir panel</a>
    <button type="button" class="enlace" id="btnCerrarSesion">Cerrar sesión</button>
  </section>

  <div id="estado"></div>
  <script src="popup.js"></script>
</body>
</html>
